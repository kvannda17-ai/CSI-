function dg(v){return String(v==null?'':v).replace(/[\u17E0-\u17E9]/g,function(c){return String(c.charCodeAt(0)-0x17E0)}).replace(/[\u0660-\u0669]/g,function(c){return String(c.charCodeAt(0)-0x0660)}).replace(/\D/g,'')}
function dol(v){var n=dg(v);return n?'$'+n:''}
function onlyNum(el){el.value=dg(el.value)}
function onlyMoney(el){var n=dg(el.value);el.value=n?'$'+n:''}
function kh(n){return String(n).replace(/\d/g,function(d){return '០១២៣៤៥៦៧៨៩'[d]})}
function fd(d){if(!d)return'';var p=d.split('-');return p[2]+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1]+'-'+p[0]}

function table(rs,del){var h='<div class="wrap"><table><thead><tr>'+['លរ','ឈ្មោះសិស្ស','ភេទ','ថ្ងៃកំណើត','អាស័យដ្ឋាន','លេខទូរស័ព្ទ','កញ្ចប់','បានបង់','តាមរយៈ','រង្វន់','គ្រូបន្ទុកថ្នាក់','កាលបរិច្ឆេទ'].map(function(c){return'<th>'+c+'</th>'}).join('')+(del?'<th class="ed"></th>':'')+'</tr></thead><tbody>';
rs.forEach(function(r,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.sex)+'</td><td>'+fd(r.dob)+'</td><td>'+esc(r.addr)+'</td><td>'+esc(dg(r.phone))+'</td><td class="n">'+(dg(r.pkg)?dg(r.pkg)+' ខែ':'')+'</td><td class="n">'+dol(r.paid)+'</td><td>'+esc(r.via)+'</td><td class="n">'+dol(r.rew)+'</td><td>'+esc(r.teacher)+'</td><td>'+fd(r.date)+'</td>'+(del?'<td class="ed"><button class="x" onclick="ed(\''+r.id+'\')">កែ</button> <button class="x" onclick="rm(\''+r.id+'\')">លុប</button></td>':'')+'</tr>'});
if(!rs.length)h+='<tr><td colspan="13" style="text-align:center;color:var(--m)">មិនទាន់មានទិន្នន័យ</td></tr>';
return h+'</tbody><tfoot><tr><td colspan="6" style="text-align:center">សរុប</td><td class="n">'+sum(rs,'pkg')+' ខែ</td><td class="n">$'+sum(rs,'paid')+'</td><td></td><td class="n">$'+sum(rs,'rew')+'</td><td colspan="'+(del?3:2)+'"></td></tr></tfoot></table></div>'}
function sign(){return'<div class="sig"><div>ធ្វើនៅថ្ងៃទី .......... ខែ ........... ឆ្នាំ ..........<br><b>គណនេយ្យ</b><br><br><br></div></div>'}

function f(id,l,t,v,x){return'<div><label>'+l+'</label><input id="f_'+id+'" type="'+(t||'text')+'" value="'+esc(v)+'" '+(x||'')+'></div>'}
return'<div class="card f"><div class="grid">'+f('name','ឈ្មោះសិស្ស','text',r.name)+'<div><label>ភេទ</label><select id="f_sex"><option>ប្រុស</option><option'+(r.sex==='ស្រី'?' selected':'')+'>ស្រី</option></select></div>'+f('dob','ថ្ងៃកំណើត','date',r.dob)+f('addr','អាស័យដ្ឋាន (ភូមិ, ឃុំ)','text',r.addr,'list="dv"')+f('phone','លេខទូរស័ព្ទ','tel',dg(r.phone),'inputmode="numeric" oninput="onlyNum(this)" placeholder="031..."')+f('pkg','កញ្ចប់ (ខែ)','text',dg(r.pkg),'inputmode="numeric" oninput="onlyNum(this)" placeholder="1 / 3"')+f('paid','បានបង់','text',dol(r.paid),'inputmode="numeric" oninput="onlyMoney(this)" placeholder="$100"')+f('via','តាមរយៈ','text',r.via||'សាលា')+f('rew','រង្វន់','text',dol(r.rew),'inputmode="numeric" oninput="onlyMoney(this)" placeholder="$5"')+f('teacher','គ្រូបន្ទុកថ្នាក់','text',r.teacher,'list="dt"')+f('date','កាលបរិច្ឆេទ','date',r.date||new Date().toISOString().slice(0,10))+'</div><div class="row"><button class="btn pri" onclick="add()">'+(edit?'រក្សាទុកការកែ':'+ បន្ថែមសិស្ស')+'</button>'+(edit?'<button class="btn" onclick="go(tab)">បោះបង់</button>':'')+'</div></div>'}
function add(){var g=function(k){return $('f_'+k).value.trim()};if(!g('name')){alert('សូមបញ្ចូលឈ្មោះសិស្ស');return}
var o={w:tab,name:g('name'),sex:g('sex'),dob:g('dob'),addr:g('addr'),phone:dg(g('phone')),pkg:dg(g('pkg')),paid:dg(g('paid')),via:g('via'),rew:dg(g('rew')),teacher:g('teacher'),date:g('date')};

$('app').innerHTML=h}
function saveS(){var l=function(i){return $(i).value.split('\n').map(function(s){return s.trim()}).filter(Boolean)};S.teachers=l('st');S.villages=l('sv');save();alert('បានរក្សាទុក');draw()}

function pdate(){var d=new Date(),m=['January','February','March','April','May','June','July','August','September','October','November','December'];var h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return ('0'+d.getDate()).slice(-2)+'-'+m[d.getMonth()]+'-'+d.getFullYear()+', '+h+':'+('0'+d.getMinutes()).slice(-2)+' '+ap}
