<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ប្រព័ន្ធគ្រប់គ្រងទិន្នន័យ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap');
:root{--bg:#17141f;--panel:#211d2d;--field:#17141f;--line:#40365b;--purple:#aa88ed;--text:#f4efff;--muted:#b7a7dc;--head:#34284c;--danger:#e58b9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Kantumruy Pro','Battambang',sans-serif;padding:26px 3vw 45px}
.wrap{max-width:1450px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
h1{font-size:clamp(25px,3vw,38px);color:var(--purple);margin:0;font-weight:700}
button,.btn{border:0;border-radius:13px;padding:14px 20px;background:var(--purple);color:white;font:600 17px inherit;cursor:pointer}
button:hover{filter:brightness(1.08)}.ghost{background:#332747;color:var(--purple);border:1px solid var(--line)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:26px;margin-bottom:26px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.stat{text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:24px 12px}
.stat strong{display:block;color:var(--purple);font-size:36px;margin-bottom:8px}.stat span{color:var(--muted);font-size:17px}
form .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
label{display:block;color:var(--muted);font-size:18px;margin-bottom:8px}
input,select{width:100%;background:var(--field);border:2px solid var(--line);border-radius:15px;padding:17px 18px;color:var(--text);font:18px 'Kantumruy Pro','Battambang',sans-serif;outline:none;min-height:60px}
input:focus,select:focus{border-color:var(--purple)}
.full{grid-column:1/-1}.submit{width:100%;margin-top:20px;min-height:66px;font-size:21px}
.toolbar{display:grid;grid-template-columns:2fr 1fr auto auto;gap:14px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:720px}th{background:var(--head);color:var(--purple);font-size:18px;text-align:left;padding:17px 14px}td{padding:15px 14px;border-bottom:1px solid var(--line);font-size:16px}
.table-wrap{overflow:auto}.empty{text-align:center;color:var(--muted);padding:35px}
.actions{display:flex;gap:8px}.small{padding:8px 12px;font-size:14px;border-radius:9px}.delete{background:#542b3a;color:#ffdbe1}
.hidden{display:none!important}.login{max-width:520px;margin:8vh auto}.login h2{color:var(--purple);margin-top:0}.login input{margin-bottom:16px}
.note{color:var(--muted);font-size:14px;line-height:1.8;margin-top:16px}.error{color:#ff9eaa;margin:8px 0}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}form .grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.panel{padding:18px}}
@media(max-width:500px){body{padding:18px 12px}.stats{gap:10px}.stat{padding:18px 6px}.stat strong{font-size:28px}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📚👇 សូមបញ្ចូលឈ្មោះនៅខាងក្រោម</h1>
    <button id="adminOpen" class="ghost">🔐 ចូលគ្រប់គ្រង</button>
  </header>

  <section id="customerView" class="panel">
    <form id="customerForm">
      <div class="grid">
        <div class="full"><label for="cName">គោត្តនាម-នាម 👇</label><input id="cName" required maxlength="100" autocomplete="name"></div>
        <div><label for="cGender">ភេទ 👇</label><select id="cGender" required><option value="ស្រី">ស្រី</option><option value="ប្រុស">ប្រុស</option></select></div>
        <div><label for="cPhone">លេខទូរស័ព្ទ 👇</label><input id="cPhone" required inputmode="tel" maxlength="25"></div>
        <div><label for="cClass">ចំនួន 👇</label><select id="cClass" required><option>១ ក្បាល</option><option>២ ក្បាល</option><option>៣ ក្បាល</option><option>៤ ក្បាល</option><option>៥ ក្បាល</option><option>៦ ក្បាល</option><option>៧ ក្បាល</option><option>៨ ក្បាល</option><option>៩ ក្បាល</option><option>១០ ក្បាល</option><option>១១ ក្បាល</option><option>១២ ក្បាល</option></select></div>
      </div>
      <button class="submit" type="submit">📩 បញ្ចូល</button>
      <p id="customerMsg" class="note" role="status"></p>
    </form>
  </section>

  <section id="loginView" class="panel login hidden">
    <h2>🔐 ចូលប្រព័ន្ធ Admin</h2>
    <form id="loginForm">
      <label for="username">Username</label><input id="username" required autocomplete="username">
      <label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
      <p id="loginError" class="error"></p>
      <button class="submit" type="submit">ចូលប្រព័ន្ធ</button>
      <button id="backCustomer" class="ghost submit" type="button">ត្រឡប់ទៅទំព័រ Customer</button>
    </form>
  </section>

  <section id="adminView" class="hidden">
    <div class="top"><h1>ផ្ទាំងគ្រប់គ្រង Admin</h1><button id="logout" class="ghost">ចាកចេញ</button></div>
    <div class="stats">
      <div class="stat"><strong id="total">0</strong><span>អ្នកបានបញ្ចូលសរុប</span></div>
      <div class="stat"><strong id="femaleTotal">0</strong><span>ស្រី</span></div>
      <div class="stat"><strong id="maleTotal">0</strong><span>ប្រុស</span></div>
      <div class="stat"><strong id="classTotal">0</strong><span>ប្រភេទ/ថ្នាក់</span></div>
    </div>
    <section class="panel">
      <form id="adminForm">
        <div class="grid">
          <div><label for="aName">គោត្តនាម-នាម *</label><input id="aName" required maxlength="100"></div>
          <div><label for="aGender">ភេទ *</label><select id="aGender"><option>ស្រី</option><option>ប្រុស</option></select></div>
          <div><label for="aPhone">លេខទូរស័ព្ទ *</label><input id="aPhone" required maxlength="25"></div>
          <div><label for="aClass">ចំនួន *</label><select id="aClass"><option>១ ក្បាល</option><option>២ ក្បាល</option><option>៣ ក្បាល</option><option>៤ ក្បាល</option><option>៥ ក្បាល</option><option>៦ ក្បាល</option><option>៧ ក្បាល</option><option>៨ ក្បាល</option><option>៩ ក្បាល</option><option>១០ ក្បាល</option><option>១១ ក្បាល</option><option>១២ ក្បាល</option></select></div>
        </div>
        <button class="submit" type="submit">＋ បញ្ចូលទិន្នន័យ</button>
      </form>
    </section>
    <section class="panel">
      <div class="toolbar">
        <input id="search" placeholder="🔎 ស្វែងរកតាមឈ្មោះ ឬលេខទូរស័ព្ទ">
        <select id="filter"><option value="">គ្រប់ចំនួន/ក្បាល</option><option>១ ក្បាល</option><option>២ ក្បាល</option><option>៣ ក្បាល</option><option>៤ ក្បាល</option><option>៥ ក្បាល</option><option>៦ ក្បាល</option><option>៧ ក្បាល</option><option>៨ ក្បាល</option><option>៩ ក្បាល</option><option>១០ ក្បាល</option><option>១១ ក្បាល</option><option>១២ ក្បាល</option></select>
        <button id="print" class="ghost" type="button">🖨 បោះពុម្ព</button>
        <button id="csv" class="ghost" type="button">↓ CSV</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>គោត្តនាម-នាម</th><th>ភេទ</th><th>លេខទូរស័ព្ទ</th><th>ចំនួន</th><th>សកម្មភាព</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div id="empty" class="empty">មិនទាន់មានទិន្នន័យ</div>
    </section>
  </section>
</div>
<script>
const KEY='khmer_records_v1';
let records=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(records));
const show=id=>['customerView','loginView','adminView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
function addRecord(name,gender,phone,group){records.unshift({id:Date.now()+Math.random(),name:name.trim(),gender,phone:phone.trim(),group,created:new Date().toLocaleString('km-KH')});save();render();}
$('adminOpen').onclick=()=>show('loginView');
$('backCustomer').onclick=()=>show('customerView');
$('customerForm').onsubmit=e=>{e.preventDefault();addRecord($('cName').value,$('cGender').value,$('cPhone').value,$('cClass').value);$('customerForm').reset();$('customerMsg').textContent='បានបញ្ចូលទិន្នន័យដោយជោគជ័យ។ សូមអរគុណ!';};
$('loginForm').onsubmit=e=>{e.preventDefault();if($('username').value==='V13'&&$('password').value==='123'){show('adminView');$('loginError').textContent='';render();}else $('loginError').textContent='Username ឬ Password មិនត្រឹមត្រូវទេ';};
$('logout').onclick=()=>show('customerView');
$('adminForm').onsubmit=e=>{e.preventDefault();addRecord($('aName').value,$('aGender').value,$('aPhone').value,$('aClass').value);$('adminForm').reset();};
$('search').oninput=render;$('filter').onchange=render;
function render(){
 $('total').textContent=records.length;
 $('femaleTotal').textContent=records.filter(r=>r.gender==='ស្រី').length;
 $('maleTotal').textContent=records.filter(r=>r.gender==='ប្រុស').length;
 $('classTotal').textContent=new Set(records.map(r=>r.group)).size;
 const q=$('search').value.toLowerCase(),f=$('filter').value;
 const list=records.filter(r=>(!f||r.group===f)&&(!q||r.name.toLowerCase().includes(q)||r.phone.toLowerCase().includes(q)));
 $('rows').innerHTML=list.map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHTML(r.name)}</td><td>${escapeHTML(r.gender)}</td><td>${escapeHTML(r.phone)}</td><td>${escapeHTML(r.group)}</td><td><button class="small delete" data-id="${r.id}">លុប</button></td></tr>`).join('');
 $('empty').classList.toggle('hidden',list.length!==0);
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{if(confirm('តើអ្នកពិតជាចង់លុបទិន្នន័យនេះមែនទេ?')){records=records.filter(r=>String(r.id)!==b.dataset.id);save();render();}});
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('csv').onclick=()=>{const head=['ល.រ','គោត្តនាម-នាម','ភេទ','លេខទូរស័ព្ទ','ចំនួន'];const lines=[head,...records.map((r,i)=>[i+1,r.name,r.gender,r.phone,r.group])].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='customer-records.csv';a.click();URL.revokeObjectURL(a.href);};
$('print').onclick=()=>window.print();
render();
</script>
</body>
</html>
